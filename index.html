<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
</head>
<body>
    
    <h1>Calculadora IMC</h1>

    <form onsubmit="return calcular(event)">
        <label for="peso">Digite seu peso..</label><br><br>
        <input type="text" id="peso" placeholder="Digite seu peso.."><br><br>
        <label for="altura"></label><br><br>
        <input type="text" id="altura" placeholder="Digite sua altura.."><br><br>
        <input type="submit" placeholder="Calcular IMC">
    </form>

     <div id="container"></div>
   
    <!--script js-->
    <script src="./js/script.js"></script>

</body>
